<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avaliações — Rotação Upseller</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0a0f1e; --card:#1a2235; --card2:#141b2a; --border:#1f2d45;
    --accent:#2563eb; --accent2:#06b6d4; --green:#22c55e; --amber:#f59e0b; --red:#ef4444;
    --text:#f1f5f9; --muted:#8294b0; --muted2:#5e6f8c;
  }
  :root[data-theme="light"]{
    --bg:#f4f7fb; --card:#ffffff; --card2:#f1f5f9; --border:#e2e8f0;
    --accent:#2563eb; --accent2:#0891b2; --green:#16a34a; --amber:#d97706; --red:#dc2626;
    --text:#0f172a; --muted:#64748b; --muted2:#94a3b8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5}
  a{color:var(--accent);cursor:pointer}
  h1,h2,h3{margin:0}
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px 60px}
  /* header */
  header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--border)}
  .hd{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 18px}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:18px}
  .hd h1{font-size:16px;font-weight:600}
  .hd .sub{font-size:11px;color:var(--muted)}
  .hd .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
  .iconbtn{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:7px 10px;cursor:pointer;font-size:14px}
  .iconbtn:hover{border-color:var(--accent)}
  /* tabs */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 18px}
  .tab{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:500}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tab:hover:not(.active){color:var(--text)}
  /* cards */
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px}
  .card h2{font-size:15px;margin-bottom:4px}
  .card .muted{color:var(--muted);font-size:12px}
  .grid{display:grid;gap:12px}
  .grid.c2{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .grid.c3{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  /* buttons */
  .btn{border:none;border-radius:10px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;font-family:inherit}
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
  .btn.primary{background:var(--accent)}
  .btn.green{background:var(--green)}
  .btn.amber{background:var(--amber)}
  .btn.red{background:var(--red)}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
  .btn.sm{padding:6px 11px;font-size:12px}
  /* inputs */
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
  input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text);font-size:13px;font-family:inherit;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  textarea{min-height:76px;resize:vertical}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>*{flex:1;min-width:140px}
  /* badges */
  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600}
  .b-grey{background:rgba(130,148,176,.18);color:var(--muted)}
  .b-blue{background:rgba(37,99,235,.18);color:#60a5fa}
  .b-green{background:rgba(34,197,94,.18);color:#4ade80}
  .b-amber{background:rgba(245,158,11,.18);color:#fbbf24}
  .b-red{background:rgba(239,68,68,.18);color:#f87171}
  /* table */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;font-size:12px}
  tr:hover td{background:var(--card2)}
  /* question block */
  .q{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
  .q .enun{font-weight:600;margin-bottom:10px}
  .opt{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--border);border-radius:9px;margin-bottom:6px;cursor:pointer;background:var(--card)}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--accent);background:rgba(37,99,235,.12)}
  .opt.ok{border-color:var(--green);background:rgba(34,197,94,.12)}
  .opt.err{border-color:var(--red);background:rgba(239,68,68,.12)}
  .opt .k{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
  .opt.sel .k{border-color:var(--accent);background:var(--accent);color:#fff}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:28px 14px}
  .modal.open{display:flex}
  .modal .box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;max-width:640px}
  .modal .box.wide{max-width:900px}
  /* misc */
  .center{text-align:center}
  .muted{color:var(--muted)}
  .spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 18px;font-size:13px;z-index:80;box-shadow:0 12px 40px rgba(0,0,0,.4);display:none}
  .toast.show{display:block}
  .toast.err{border-color:var(--red);color:#f87171}
  .toast.ok{border-color:var(--green);color:#4ade80}
  .bar{height:10px;background:var(--card2);border-radius:999px;overflow:hidden}
  .bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .kpi{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px}
  .kpi .n{font-size:26px;font-weight:700}
  .kpi .l{font-size:11px;color:var(--muted);margin-top:2px}
  .chk{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--border);border-radius:9px;background:var(--card2);margin-bottom:5px;cursor:pointer;font-size:13px}
  .chk input{width:auto}
  /* login */
  #login{max-width:360px;margin:9vh auto 0}
  /* ── Quiz ao vivo (apresentação, estilo UpSeller) ── */
  #quiz-stage{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;overflow:hidden;
    background:radial-gradient(130% 100% at 50% -20%, #12347e 0%, #0a1c4d 42%, #060d26 100%);
    color:#fff;font-family:'Segoe UI',system-ui,sans-serif;padding:clamp(16px,2.4vh,26px) clamp(18px,5vw,64px)}
  #quiz-stage.on{display:flex}
  #quiz-stage::before{content:'';position:absolute;left:-20%;right:-20%;bottom:-30%;height:70%;pointer-events:none;
    background:radial-gradient(60% 100% at 50% 100%, rgba(59,155,255,.35), transparent 70%);
    filter:blur(8px);animation:qzsweep 7s ease-in-out infinite}
  @keyframes qzsweep{0%,100%{transform:translateX(-6%)}50%{transform:translateX(6%)}}
  #quiz-stage>*{position:relative;z-index:1}
  .qz-top{display:flex;align-items:center;gap:14px;font-size:15px;color:#9fb6e0}
  .qz-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;color:#fff;letter-spacing:.3px}
  .qz-brand svg{filter:drop-shadow(0 4px 12px rgba(31,111,255,.6))}
  .qz-top .qz-title{flex:1;font-weight:600;color:#bcd0f5;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qz-badge{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 14px;font-weight:700}
  .qz-badge.n{background:linear-gradient(135deg,#1f6fff,#3b9bff);border-color:transparent;color:#fff;box-shadow:0 4px 16px rgba(31,111,255,.45)}
  .qz-ico{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
    color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:background .15s}
  .qz-ico:hover{background:rgba(255,255,255,.17)}
  .qz-prog{height:7px;border-radius:999px;background:rgba(255,255,255,.08);margin:14px 0 2px;overflow:hidden}
  .qz-prog>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#1f6fff,#ff8a1e);
    box-shadow:0 0 14px rgba(255,138,30,.6);transition:width .4s ease}
  .qz-mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:0;overflow:hidden}
  .qz-fit{width:100%;display:flex;flex-direction:column;gap:clamp(12px,2.2vh,26px);transform-origin:center center}
  .qz-anim{animation:qzin .4s cubic-bezier(.2,.8,.2,1) both}
  @keyframes qzin{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
  .qz-enun{font-size:clamp(20px,3.6vw,46px);font-weight:800;line-height:1.14;text-align:center;max-width:1150px;margin:0 auto;
    text-shadow:0 2px 20px rgba(0,0,0,.4)}
  .qz-timer{align-self:center;position:relative;width:clamp(94px,10.5vw,138px);aspect-ratio:1;border-radius:50%;
    background:conic-gradient(var(--ring,#1f6fff) calc(var(--p,100)*1%), rgba(255,255,255,.07) 0);
    display:flex;align-items:center;justify-content:center;transition:filter .3s;
    filter:drop-shadow(0 0 20px var(--glow,rgba(31,111,255,.5)))}
  .qz-timer::before{content:'';position:absolute;inset:9px;border-radius:50%;background:#0a1536}
  .qz-timenum{position:relative;font-size:clamp(34px,5.2vw,58px);font-weight:800;color:#dbe7ff}
  .qz-timer.warn{--ring:#ff8a1e;--glow:rgba(255,138,30,.55)}.qz-timer.warn .qz-timenum{color:#ffe0ad}
  .qz-timer.crit{--ring:#ef4444;--glow:rgba(239,68,68,.65);animation:qzpulse .55s infinite}.qz-timer.crit .qz-timenum{color:#fecaca}
  .qz-timer.off{--ring:#22c55e;--glow:rgba(34,197,94,.55)}.qz-timer.off .qz-timenum{color:#86efac}
  @keyframes qzpulse{50%{transform:scale(1.07)}}
  .qz-alts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,1.8vw,20px);max-width:1220px;margin:0 auto;width:100%}
  .qz-alt{display:flex;align-items:center;gap:16px;border-radius:18px;padding:clamp(14px,2.1vh,24px) clamp(16px,2vw,26px);
    font-size:clamp(18px,2.3vw,30px);font-weight:600;color:#fff;border:3px solid rgba(255,255,255,.12);
    box-shadow:0 10px 28px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.25);
    transition:opacity .35s,transform .22s,box-shadow .35s;animation:qzin .45s both}
  .qz-alt .qz-sh{font-size:clamp(20px,2.2vw,30px);width:1.2em;text-align:center;flex-shrink:0;opacity:.9}
  .qz-alt .qz-k{width:clamp(38px,2.8vw,52px);height:clamp(38px,2.8vw,52px);border-radius:11px;background:rgba(0,0,0,.22);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(19px,2vw,28px);flex-shrink:0}
  .qz-alt.cA{background:linear-gradient(135deg,#1f6fff,#1552d6)}
  .qz-alt.cB{background:linear-gradient(135deg,#ff9a3d,#f97316)}
  .qz-alt.cC{background:linear-gradient(135deg,#14c4b4,#0d9488)}
  .qz-alt.cD{background:linear-gradient(135deg,#a78bfa,#7c3aed)}
  .qz-alt.cE{background:linear-gradient(135deg,#fb7185,#e11d48)}
  #quiz-stage.reveal .qz-alt{opacity:.28;transform:scale(.98)}
  #quiz-stage.reveal .qz-alt.correct{opacity:1;transform:scale(1.04);
    box-shadow:0 0 0 5px #22c55e,0 0 46px rgba(34,197,94,.7),inset 0 1px 0 rgba(255,255,255,.3)}
  .qz-falada{text-align:center;color:#bcd0f5;font-size:clamp(17px,2vw,26px);border:2px dashed rgba(124,161,255,.35);
    border-radius:18px;padding:clamp(18px,3vh,30px);max-width:950px;margin:0 auto;background:rgba(31,111,255,.06)}
  .qz-expl{display:none;max-width:1050px;margin:0 auto;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.4);
    border-radius:16px;padding:clamp(14px,2vh,22px);font-size:clamp(16px,1.8vw,24px);line-height:1.4;animation:qzin .4s both}
  #quiz-stage.reveal .qz-expl{display:block}
  .qz-expl .qz-expl-t{color:#86efac;font-weight:800;font-size:.8em;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
  .qz-ctrls{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding-top:12px}
  .qz-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:12px;
    padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .12s,background .15s}
  .qz-btn:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
  .qz-btn:active{transform:translateY(0)}
  .qz-btn.main{background:linear-gradient(135deg,#ff9a3d,#f97316);border-color:transparent;box-shadow:0 6px 20px rgba(249,115,22,.5)}
  .qz-btn.blue{background:linear-gradient(135deg,#1f6fff,#1552d6);border-color:transparent;box-shadow:0 6px 20px rgba(31,111,255,.5)}
  .qz-hint{color:#6b82b3;font-size:12px;text-align:center;padding-top:8px}
  .qz-burst{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:3}
  .qz-burst i{position:absolute;width:12px;height:12px;border-radius:2px;opacity:.95;animation:qzpop .9s ease-out forwards}
  @keyframes qzpop{to{transform:translate(var(--tx),var(--ty)) rotate(var(--rot));opacity:0}}
  /* ── Quiz ao vivo: lobby / placar no telão ── */
  .cmp-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .cmp-chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:6px 14px;font-size:clamp(13px,1.5vw,18px);font-weight:600;animation:qzin .3s both}
  .cmp-lead{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 14px;max-width:560px;margin:4px auto 0}
  .cmp-lead-t{font-size:12px;color:#86efac;text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:6px}
  .cmp-leadrow{display:flex;align-items:center;gap:12px;padding:6px 2px;font-size:clamp(14px,1.6vw,19px)}
  .cmp-leadrow .pos{width:26px;text-align:center;font-weight:800;color:#9fb6e0}
  .cmp-leadrow .nm{flex:1;font-weight:600}
  .cmp-leadrow .pt{font-weight:800;color:#ffd48a}
  .cmp-pod{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:18px auto 0}
  .cmp-pod .col{display:flex;flex-direction:column;align-items:center;gap:6px;width:clamp(90px,12vw,140px)}
  .cmp-pod .col .nm{font-weight:700;font-size:clamp(13px,1.4vw,17px)}
  .cmp-pod .bar{width:100%;border-radius:12px 12px 0 0;background:linear-gradient(180deg,#1f6fff,#1552d6);display:flex;align-items:flex-start;justify-content:center;color:#fff;font-weight:800;font-size:clamp(16px,1.8vw,24px);padding-top:10px}
  /* ── Quiz ao vivo: tela do colaborador (celular) ── */
  .qzl-wrap{max-width:560px;margin:0 auto}
  .qzl-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .qzl-timer-bar{height:10px;border-radius:999px;background:var(--card2);overflow:hidden;margin:4px 0 16px}
  .qzl-timer-bar>i{display:block;height:100%;background:linear-gradient(90deg,#1f6fff,#ff8a1e);transition:width .5s linear}
  .qzl-enun{font-size:clamp(18px,5vw,24px);font-weight:700;line-height:1.25;margin-bottom:16px}
  .qzl-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .qzl-opt{display:flex;align-items:center;gap:10px;border:none;border-radius:14px;padding:16px 14px;font-size:15px;font-weight:600;color:#fff;cursor:pointer;text-align:left;font-family:inherit;min-height:70px;box-shadow:0 6px 16px rgba(0,0,0,.25);transition:transform .1s}
  .qzl-opt:active{transform:scale(.96)}
  .qzl-opt:disabled{opacity:.45;cursor:default}
  .qzl-opt .qzl-sh{font-size:20px;flex-shrink:0}
  .qzl-opt.cA{background:linear-gradient(135deg,#1f6fff,#1552d6)}
  .qzl-opt.cB{background:linear-gradient(135deg,#ff9a3d,#f97316)}
  .qzl-opt.cC{background:linear-gradient(135deg,#14c4b4,#0d9488)}
  .qzl-opt.cD{background:linear-gradient(135deg,#a78bfa,#7c3aed)}
  .qzl-opt.cE{background:linear-gradient(135deg,#fb7185,#e11d48)}
  .qzl-big{text-align:center;padding:30px 18px}
  .qzl-big .emo{font-size:52px;line-height:1}
  .qzl-pts{font-size:42px;font-weight:800;font-family:'DM Serif Display',serif;line-height:1}
  .qzl-rank{display:flex;flex-direction:column;gap:6px;margin-top:16px;text-align:left}
  .qzl-rankrow{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px}
  .qzl-rankrow.me{border-color:var(--accent);background:rgba(37,99,235,.12)}
  .qzl-rankrow .pos{width:28px;text-align:center;font-weight:800}
  .ups-msg{font-size:13px;padding:10px 12px;border-radius:9px;margin-top:14px;text-align:center;font-weight:600}
  .ups-msg.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35);color:#4ade80}
  .ups-msg.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#f87171}
  @media(max-width:420px){ .qzl-opts{grid-template-columns:1fr} }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="card" style="display:none">
  <div style="text-align:center;margin-bottom:6px"><div class="logo" style="margin:0 auto 10px">📝</div></div>
  <h2 class="center">Avaliações</h2>
  <div class="muted center" style="margin-bottom:8px">Entre com sua conta da Rotação</div>
  <label>E-mail</label>
  <input id="lg-email" type="email" placeholder="seu@email.com" autocomplete="username">
  <label>Senha</label>
  <input id="lg-senha" type="password" placeholder="••••••••" autocomplete="current-password">
  <button class="btn primary" style="width:100%;margin-top:14px" id="lg-btn">Entrar</button>
  <div id="lg-msg" class="center" style="margin-top:10px;font-size:12px;color:var(--red)"></div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <header>
    <div class="hd">
      <div class="logo">📝</div>
      <div>
        <h1>Avaliações <span class="muted" style="font-weight:400">· Rotação Upseller</span></h1>
        <div class="sub" id="hd-sub"></div>
      </div>
      <div class="right">
        <span id="hd-user"></span>
        <button class="iconbtn" id="btn-tema" title="Tema">🌙</button>
        <button class="iconbtn" id="btn-sair" title="Sair">Sair</button>
      </div>
    </div>
  </header>
  <div class="wrap">
    <div class="tabs" id="tabs"></div>
    <div id="view"><div class="spin"></div></div>
  </div>
</div>

<div class="modal" id="modal"><div class="box" id="modal-box"></div></div>
<div class="modal" id="modal2" style="z-index:60"><div class="box wide" id="modal2-box"></div></div>
<div class="toast" id="toast"></div>
<div id="quiz-stage"></div>

<script>
// ══════════════════════════════════════════════════════════

// ── REST helpers ──
async function api(method, path, body, useSvc){
  const key = useSvc ? SVC : ANON;
  const res = await fetch(SB+'/rest/v1/'+path, {
    method,
    headers:{ apikey:key, Authorization:'Bearer '+key, 'Content-Type':'application/json',
              Prefer: method==='GET' ? '' : 'return=representation' },
    body: body!==undefined && body!==null ? JSON.stringify(body) : undefined
  });
  const txt = await res.text(); let json=null; try{ json = txt ? JSON.parse(txt) : null; }catch(e){}
  if(!res.ok){ console.error(method, path, res.status, txt); const e=new Error((json&&json.message)||('HTTP '+res.status)); e.status=res.status; e.body=txt; throw e; }
  return json;
}

const patch = (p,b)=>api('PATCH',p,b,true);

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(msg,kind){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+(kind||'');setTimeout(()=>t.className='toast',3200);}
function fmtDt(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function fmtD(iso){ if(!iso) return '—'; return new Date(iso).toLocaleDateString('pt-BR'); }
function toISO(local){ return local ? new Date(local).toISOString() : null; }
function toLocalInput(iso){ if(!iso) return ''; const d=new Date(iso); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }

function fmtComp(c){ if(!c) return '—'; const p=String(c).split('-'); if(p.length<2) return c; const mes=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][(+p[1])-1]||p[1]; return `${mes}/${p[0]}`; }
// ── Etiquetas (tags) das questões ──
function tagsDe(q){ if(q && Array.isArray(q.tags) && q.tags.length) return q.tags; if(q && q.competencia) return [q.competencia]; return []; }
function tagsInline(q){ const t=tagsDe(q); return t.length? ' · '+t.map(esc).join(', ') : ''; }
function allTags(list){ const s=new Set(); (list||[]).forEach(q=>tagsDe(q).forEach(t=>s.add(t))); return [...s].sort((a,b)=>a.localeCompare(b)); }
let _qTags=[];
function renderQTags(){ const el=document.getElementById('q-tags-chips'); if(!el) return;
  el.innerHTML=_qTags.length? _qTags.map((t,i)=>`<span class="badge b-blue" style="display:inline-flex;align-items:center;gap:6px">${esc(t)} <span data-rm="${i}" style="cursor:pointer">✕</span></span>`).join('') : '<span class="muted" style="font-size:12px">nenhuma etiqueta</span>';
  el.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{ _qTags.splice(+x.dataset.rm,1); renderQTags(); });
}
function qTagAdd(v){ v=(v||'').trim(); if(!v) return; if(!_qTags.some(t=>t.toLowerCase()===v.toLowerCase())) _qTags.push(v); renderQTags(); }
function setupQTagInput(){ const inp=document.getElementById('q-tag-input'); if(!inp) return;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===','){ e.preventDefault(); qTagAdd(inp.value.replace(/,/g,'')); inp.value=''; } });
  inp.addEventListener('blur',()=>{ if(inp.value.trim()){ qTagAdd(inp.value); inp.value=''; } });
}
function normComp(s){ s=String(s||'').trim(); let m; if(m=s.match(/^(\d{4})[-\/](\d{1,2})$/)) return m[1]+'-'+String(m[2]).padStart(2,'0'); if(m=s.match(/^(\d{1,2})[\/-](\d{4})$/)) return m[2]+'-'+String(m[1]).padStart(2,'0'); return ''; }

function pesoDe(linkRow, questao){ return (linkRow.peso!=null?linkRow.peso:(questao?questao.peso:1)) || 0; }
function statusBadge(st){
  return ({rascunho:'<span class="badge b-grey">Rascunho</span>',
           disponivel:'<span class="badge b-green">Disponível</span>',
           encerrada:'<span class="badge b-grey">Encerrada</span>',
           em_andamento:'<span class="badge b-amber">Em andamento</span>',
           enviada:'<span class="badge b-blue">Aguardando correção</span>',
           corrigida:'<span class="badge b-blue">Corrigida</span>',
           publicada:'<span class="badge b-green">Resultado liberado</span>'}[st]||`<span class="badge b-grey">${esc(st)}</span>`);
}
function dentroJanela(a){
  const now=Date.now();
  if(a.inicio && new Date(a.inicio).getTime()>now) return false;
  if(a.fim    && new Date(a.fim).getTime()<now)    return false;
  return true;
}
async function carregarQuestoesDaAvaliacao(avalId){
  const links=await get(`avaliacao_questoes?avaliacao_id=eq.${avalId}&select=id,questao_id,ordem,peso&order=ordem.asc`);
  if(!links.length) return [];
  const ids=links.map(l=>l.questao_id);
  const qs=await get(`aval_questoes?id=in.(${ids.join(',')})&select=*`);
  const map={}; qs.forEach(q=>map[q.id]=q);
  return links.map(l=>({link:l, q:map[l.questao_id]})).filter(x=>x.q);
}

async function viewMinhas(){
  const v=document.getElementById('view');
  try{
    const dest=await get(`avaliacao_destinatarios?colaborador_id=eq.${U.id}&select=avaliacao_id`);
    const tent=await get(`avaliacao_tentativas?colaborador_id=eq.${U.id}&select=*`);
    const tByAval={}; tent.forEach(t=>tByAval[t.avaliacao_id]=t);
    let avals=[];
    if(dest.length){
      const ids=dest.map(d=>d.avaliacao_id);
      avals=await get(`avaliacoes?id=in.(${ids.join(',')})&select=*&order=created_at.desc`);
    }
    if(!avals.length){ v.innerHTML=`<div class="card center muted">Nenhuma avaliação destinada a você por enquanto.</div>`; return; }
    v.innerHTML = `<div class="grid c2">`+avals.map(a=>{
      const t=tByAval[a.id]; let acao='', info='';
      if(t){
        if(t.status==='em_andamento' && a.status==='disponivel' && dentroJanela(a)){ acao=`<button class="btn primary sm" onclick="responder('${a.id}')">Continuar</button>`; info=statusBadge('em_andamento'); }
        else if(t.status==='publicada'){ acao=`<button class="btn green sm" onclick="verResultado('${t.id}')">Ver resultado</button>`; info=statusBadge('publicada'); }
        else { info=statusBadge(t.status==='em_andamento'?'enviada':t.status); acao=`<span class="muted" style="font-size:12px">Enviada em ${fmtDt(t.enviado_em)}</span>`; }
      } else {
        if(a.status==='disponivel' && dentroJanela(a)){ acao=`<button class="btn primary sm" onclick="iniciar('${a.id}')">Iniciar avaliação</button>`; info=statusBadge('disponivel'); }
        else { info=statusBadge(a.status==='disponivel'?'encerrada':a.status); acao=`<span class="muted" style="font-size:12px">Indisponível</span>`; }
      }
      const janela = (a.inicio||a.fim) ? `<div class="muted" style="font-size:11px;margin-top:6px">⏱️ ${a.inicio?fmtDt(a.inicio):'—'} → ${a.fim?fmtDt(a.fim):'sem prazo'}</div>` : '';
      return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:start">
        <h2>${esc(a.titulo)}</h2>${info}</div>
        <div class="muted" style="margin:6px 0">${esc(a.descricao||'')}</div>
        ${janela}
        <div style="margin-top:12px">${acao}</div></div>`;
    }).join('')+`</div>`;
  }catch(e){ v.innerHTML=`<div class="card" style="color:var(--red)">Erro: ${esc(e.message)}</div>`; }
}

async function iniciar(avalId){
  try{
    // trava: já existe tentativa?
    const ex=await get(`avaliacao_tentativas?avaliacao_id=eq.${avalId}&colaborador_id=eq.${U.id}&select=id,status&limit=1`);
    if(ex.length){ if(ex[0].status!=='em_andamento'){ toast('Você já realizou esta avaliação.','err'); viewMinhas(); return; } }
    else { await post('avaliacao_tentativas',{avaliacao_id:avalId,colaborador_id:U.id,status:'em_andamento'}); }
    responder(avalId);
  }catch(e){
    if(e.status===409){ toast('Você já realizou esta avaliação.','err'); viewMinhas(); }
    else toast('Erro ao iniciar: '+e.message,'err');
  }
}

let _respAtual=null; // {aval, tentativa, itens:[{link,q}], respostas:{questaoId:valor}}
async function responder(avalId){
  const v=document.getElementById('view'); v.innerHTML='<div class="spin"></div>';
  try{
    const aval=(await get(`avaliacoes?id=eq.${avalId}&select=*&limit=1`))[0];
    if(!aval||aval.status!=='disponivel'||!dentroJanela(aval)){ toast('Avaliação indisponível.','err'); viewMinhas(); return; }
    const tent=(await get(`avaliacao_tentativas?avaliacao_id=eq.${avalId}&colaborador_id=eq.${U.id}&select=*&limit=1`))[0];
    if(!tent||tent.status!=='em_andamento'){ toast('Você já enviou esta avaliação.','err'); viewMinhas(); return; }
    let itens=await carregarQuestoesDaAvaliacao(avalId);
    if(aval.embaralhar) itens=itens.sort(()=>Math.random()-0.5);
    _respAtual={aval,tentativa:tent,itens,respostas:{}};
    renderResponder();
  }catch(e){ v.innerHTML=`<div class="card" style="color:var(--red)">Erro: ${esc(e.message)}</div>`; }
}
function renderResponder(){
  const {aval,itens,respostas}=_respAtual;
  const v=document.getElementById('view');
  v.innerHTML=`<div class="card"><h2>${esc(aval.titulo)}</h2><div class="muted">${esc(aval.descricao||'')}</div>
    <div class="muted" style="margin-top:6px;font-size:12px">⚠️ Você tem apenas <b>uma tentativa</b>. Responda tudo e clique em Enviar.</div></div>
    <div id="resp-qs">`+itens.map((it,i)=>{
      const q=it.q; const pts=pesoDe(it.link,q);
      let body='';
      if(q.tipo==='objetiva'){
        const alts=q.alternativas||{};
        body=Object.keys(alts).filter(k=>alts[k]!=null&&alts[k]!=='').map(k=>
          `<div class="opt" data-q="${q.id}" data-k="${k}" onclick="marcarOpcao('${q.id}','${k}')"><div class="k">${k}</div><div>${esc(alts[k])}</div></div>`).join('');
      } else {
        body=`<textarea data-q="${q.id}" placeholder="Digite sua resposta…" oninput="respDiss('${q.id}',this.value)"></textarea>`;
      }
      return `<div class="q"><div class="enun">${i+1}. ${esc(q.enunciado)} <span class="muted" style="font-weight:400">(${pts} pt${pts>1?'s':''})</span></div>${body}</div>`;
    }).join('')+`</div>
    <button class="btn green" onclick="enviarAvaliacao()">✅ Enviar avaliação</button>
    <button class="btn ghost" onclick="viewMinhas()">Voltar</button>`;
}
function marcarOpcao(qid,k){
  _respAtual.respostas[qid]=k;
  document.querySelectorAll(`.opt[data-q="${qid}"]`).forEach(o=>o.classList.toggle('sel',o.dataset.k===k));
}
function respDiss(qid,val){ _respAtual.respostas[qid]=val; }

async function enviarAvaliacao(){
  const {aval,tentativa,itens,respostas}=_respAtual;
  const faltando=itens.filter(it=> !respostas[it.q.id] || String(respostas[it.q.id]).trim()==='');
  if(faltando.length){ if(!confirm(`${faltando.length} questão(ões) sem resposta. Enviar mesmo assim? (não dá para refazer)`)) return; }
  else if(!confirm('Enviar a avaliação? Você não poderá refazer.')) return;
  try{
    let nota=0, notaMax=0;
    const rows=itens.map(it=>{
      const q=it.q, pmax=pesoDe(it.link,q); notaMax+=pmax;
      const r=respostas[q.id]||null;
      let correta=null, pontos=null;
      if(q.tipo==='objetiva'){ correta = (r && q.resposta_correta && r===q.resposta_correta); pontos = correta?pmax:0; nota+=pontos; }
      return {tentativa_id:tentativa.id, questao_id:q.id, resposta:r, correta, pontos, pontos_max:pmax, feedback:null};
    });
    await post('avaliacao_respostas', rows);
    const temDiss=itens.some(it=>it.q.tipo==='dissertativa');
    await patch(`avaliacao_tentativas?id=eq.${tentativa.id}`, {
      status:'enviada', enviado_em:new Date().toISOString(),
      nota, nota_max:notaMax, percentual: notaMax? Math.round(nota/notaMax*100):0
    });
    toast(temDiss?'Enviada! Aguardando correção do gestor.':'Enviada! Aguardando liberação do resultado.','ok');
    abaAtual='minhas'; renderTabs(); viewMinhas();
  }catch(e){ toast('Erro ao enviar: '+e.message,'err'); }
}

async function verResultado(tentId){
  const v=document.getElementById('view'); v.innerHTML='<div class="spin"></div>';
  try{
    const t=(await get(`avaliacao_tentativas?id=eq.${tentId}&select=*&limit=1`))[0];
    const aval=(await get(`avaliacoes?id=eq.${t.avaliacao_id}&select=*&limit=1`))[0];
    const resp=await get(`avaliacao_respostas?tentativa_id=eq.${tentId}&select=*`);
    const qids=resp.map(r=>r.questao_id);
    const qs=qids.length? await get(`aval_questoes?id=in.(${qids.join(',')})&select=*`):[];
    const qmap={}; qs.forEach(q=>qmap[q.id]=q);
    const pct=t.percentual||0; const aprovado=t.aprovado;
    v.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <div><h2>${esc(aval.titulo)}</h2><div class="muted">Resultado liberado</div></div>
        <div class="center"><div style="font-size:30px;font-weight:800;color:${aprovado?'var(--green)':'var(--red)'}">${pct}%</div>
        ${aprovado!=null?`<span class="badge ${aprovado?'b-green':'b-red'}">${aprovado?'Aprovado':'Recuperação'}</span>`:''}</div>
      </div>
      <div class="muted" style="margin-top:8px">Nota: ${t.nota??'—'} / ${t.nota_max??'—'} · Corte: ${aval.nota_corte}%</div></div>`
      + resp.map((r,i)=>{
        const q=qmap[r.questao_id]||{}; const ok=r.correta;
        let body='';
        if(q.tipo==='objetiva'){
          const alts=q.alternativas||{};
          body=Object.keys(alts).filter(k=>alts[k]).map(k=>{
            let cls=''; if(k===q.resposta_correta) cls='ok'; else if(k===r.resposta && k!==q.resposta_correta) cls='err';
            return `<div class="opt ${cls}"><div class="k">${k}</div><div>${esc(alts[k])}</div></div>`;
          }).join('');
        } else {
          body=`<div class="muted" style="font-size:12px">Sua resposta:</div><div class="q" style="margin:4px 0">${esc(r.resposta||'—')}</div>
                ${r.feedback?`<div class="muted" style="font-size:12px">Comentário do corretor:</div><div class="q" style="margin:4px 0">${esc(r.feedback)}</div>`:''}`;
        }
        return `<div class="q"><div class="enun">${i+1}. ${esc(q.enunciado||'')}
          <span class="badge ${ok?'b-green':(ok===false?'b-red':'b-grey')}" style="float:right">${r.pontos??0}/${r.pontos_max??0} pt</span></div>
          ${body}
          ${q.explicacao?`<div class="muted" style="font-size:12px;margin-top:6px">💡 ${esc(q.explicacao)}</div>`:''}</div>`;
      }).join('')
      + `<button class="btn ghost" onclick="viewMinhas()">Voltar</button>`;
  }catch(e){ v.innerHTML=`<div class="card" style="color:var(--red)">Erro: ${esc(e.message)}</div>`; }
}

async function salvarQuestao(id){
  const tipo=inVal('q-tipo'); const enun=inVal('q-enun').trim();
  if(!enun){ toast('Preencha o enunciado.','err'); return; }
  const alts={}; document.querySelectorAll('.q-alt').forEach(i=>{ if(i.value.trim()) alts[i.dataset.k]=i.value.trim(); });
  let resp=inVal('q-resp')||null;
  if(tipo==='objetiva'){
    if(Object.keys(alts).length<2){ toast('Objetiva precisa de pelo menos 2 alternativas.','err'); return; }
    if(!resp||!alts[resp]){ toast('Escolha a resposta correta (entre as alternativas preenchidas).','err'); return; }
  } else { resp=null; }
  if(inVal('q-tag-input').trim()) qTagAdd(inVal('q-tag-input'));
  const body={ enunciado:enun, tipo, categoria_id:inVal('q-cat')||null, peso:parseFloat(inVal('q-peso'))||1,
    alternativas: tipo==='objetiva'?alts:null, resposta_correta:resp, explicacao:inVal('q-exp').trim()||null,
    tags:_qTags.slice() };
  try{
    if(id){ await patch(`aval_questoes?id=eq.${id}`, body); } else { body.criado_por=U.id; await post('aval_questoes', body); }
    closeModal(); toast('Questão salva.','ok'); viewBanco();
  }catch(e){ toast('Erro: '+e.message,'err'); }

let _importRows=[];
let _bancoQ=[], _bancoCatMap={}, _avalSel=[];  // estado do seletor de questões da avaliação
async function viewImportar(){

  v.innerHTML=`<div class="card"><h2>Importar questões por planilha</h2>
    <div class="muted" style="margin:6px 0 12px">Baixe o modelo, preencha e envie. Colunas: <b>categoria, etiquetas, enunciado, tipo, alternativa_a..e, resposta_correta, peso, explicacao</b>. Em "etiquetas" use várias separadas por vírgula ou ponto-e-vírgula (ex.: N1; Setembro; Time X).</div>

    </div>

function baixarModelo(){
  const head=["categoria","etiquetas","enunciado","tipo","alternativa_a","alternativa_b","alternativa_c","alternativa_d","alternativa_e","resposta_correta","peso","explicacao"];
  const ex=[
    ["Produto","N1; Setembro","Qual é o prazo padrão de entrega?","objetiva","24 horas","3 dias úteis","7 dias úteis","15 dias úteis","","C",1,"Prazo padrão: 7 dias úteis."],
    ["Atendimento","N2; Setembro","Como você conduziria um cliente insatisfeito?","dissertativa","","","","","","",2,"Avaliar empatia e solução."],
  ];
  const ws=XLSX.utils.aoa_to_sheet([head,...ex]);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Questões");
  XLSX.writeFile(wb,"modelo_questoes.xlsx");
}
function lerPlanilha(file){
  if(!file) return;
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames.find(n=>/quest/i.test(n))||wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      _importRows=rows.map((r,idx)=>{
        const g=(...names)=>{ for(const n of names){ const k=Object.keys(r).find(kk=>kk.toLowerCase().trim()===n); if(k!=null) return String(r[k]).trim(); } return ''; };
        const tipo=(g('tipo')||'objetiva').toLowerCase().startsWith('diss')?'dissertativa':'objetiva';
        const alts={}; ['a','b','c','d','e'].forEach(L=>{ const val=g('alternativa_'+L,'alt_'+L,L); if(val) alts[L.toUpperCase()]=val; });
        const resp=(g('resposta_correta','resposta','correta','gabarito')||'').toUpperCase().slice(0,1);
        const peso=parseFloat(String(g('peso','pontos')).replace(',','.'))||1;
        const tagsRaw=g('etiquetas','etiqueta','tags','competencia','competência','mes','mês');
        const tags=tagsRaw.split(/[;,]/).map(s=>s.trim()).filter(Boolean);
        const row={ _linha:idx+2, categoria:g('categoria','assunto'), tags,
          enunciado:g('enunciado','pergunta','questao','questão'),
          tipo, alternativas:alts, resposta_correta: tipo==='objetiva'?resp:'', peso, explicacao:g('explicacao','explicação','comentario') };
        row._erros=[];
        if(!row.enunciado) row._erros.push('sem enunciado');
        if(tipo==='objetiva'){ if(Object.keys(alts).length<2) row._erros.push('menos de 2 alternativas'); if(!resp||!alts[resp]) row._erros.push('resposta correta inválida'); }
        return row;
      }).filter(r=>r.enunciado||r.categoria);
      renderPreviewImport();
    }catch(err){ toast('Erro ao ler planilha: '+err.message,'err'); }
  };
  rd.readAsArrayBuffer(file);
}
function renderPreviewImport(){
  const el=document.getElementById('imp-preview');
  const ok=_importRows.filter(r=>!r._erros.length), bad=_importRows.filter(r=>r._erros.length);
  el.innerHTML=`<div class="card"><h2>Pré-visualização</h2>
    <div class="muted" style="margin:6px 0">${ok.length} válida(s) · ${bad.length} com problema(s)</div>
    <div style="overflow:auto"><table><thead><tr><th>Linha</th><th>Categoria</th><th>Etiquetas</th><th>Enunciado</th><th>Tipo</th><th>Correta</th><th>Peso</th><th>Status</th></tr></thead><tbody>`+
    _importRows.map(r=>`<tr>
      <td>${r._linha}</td><td class="muted">${esc(r.categoria||'—')}</td>
      <td class="muted">${(r.tags&&r.tags.length)?r.tags.map(esc).join(', '):'<span style="opacity:.6">(só padrão)</span>'}</td>
      <td>${esc((r.enunciado||'').slice(0,60))}${r.enunciado.length>60?'…':''}</td>
      <td>${r.tipo==='objetiva'?'Obj':'Diss'}</td><td>${esc(r.resposta_correta||'—')}</td><td>${r.peso}</td>
      <td>${r._erros.length?`<span class="badge b-red">${esc(r._erros.join(', '))}</span>`:'<span class="badge b-green">ok</span>'}</td>
    </tr>`).join('')+`</tbody></table></div>
    <div style="margin-top:14px"><button class="btn green" ${ok.length?'':'disabled'} onclick="confirmarImport()">Importar ${ok.length} questão(ões)</button></div></div>`;
}
async function confirmarImport(){
  const ok=_importRows.filter(r=>!r._erros.length); if(!ok.length) return;
  try{
    // garante categorias (idempotente: se já existir, reaproveita em vez de duplicar)
    let cats=await get('aval_categorias?select=id,nome');
    const nomeToId={}; cats.forEach(c=>nomeToId[c.nome.toLowerCase()]=c.id);
    const nomesUsados=[...new Set(ok.map(r=>r.categoria).filter(Boolean))];
    for(const nome of nomesUsados){
      const key=nome.toLowerCase();
      if(nomeToId[key]) continue;
      try{ const c=await post('aval_categorias',{nome}); nomeToId[key]=c[0].id; }
      catch(e){ // provavelmente já existe (corrida/ import anterior) → busca o id
        const ex=await get(`aval_categorias?select=id,nome&nome=ilike.${encodeURIComponent(nome)}&limit=1`);
        if(ex && ex.length) nomeToId[key]=ex[0].id; else throw e;
      }
    }
    const tagsPad=(inVal('imp-tags')||'').split(/[;,]/).map(s=>s.trim()).filter(Boolean);
    const payload=ok.map(r=>{
      const tags=[...new Set([...(r.tags||[]), ...tagsPad])];
      return { enunciado:r.enunciado, tipo:r.tipo, categoria_id: r.categoria?nomeToId[r.categoria.toLowerCase()]:null,
        alternativas: r.tipo==='objetiva'?r.alternativas:null, resposta_correta:r.resposta_correta||null,
        peso:r.peso, explicacao:r.explicacao||null, tags, criado_por:U.id };
    });
    await post('aval_questoes', payload);
    toast(`${payload.length} questão(ões) importada(s)!`,'ok');
    _importRows=[]; abaAtual='banco'; renderTabs(); viewBanco();
  }catch(e){ toast('Erro ao importar: '+e.message,'err'); }
}

    <div id="a-selecionadas" style="border:1px solid var(--border);border-radius:9px;padding:8px;min-height:52px;max-height:260px;overflow:auto"></div>

    <div style="max-height:180px;overflow:auto;border:1px solid var(--border);border-radius:9px;padding:8px">
      ${colabs.filter(c=>c.ativo!==false).map(c=>`<label class="chk"><input type="checkbox" class="a-d" value="${c.id}" ${selD.includes(c.id)?'checked':''}> ${esc(c.apelido||c.nome)}</label>`).join('')}
    </div>
    <div style="margin-top:14px"><button class="btn primary" onclick="salvarAvaliacao('${id||''}')">Salvar</button>

// ── Seletor de questões (lista escolhida + picker com filtros) ──
function renderSelecionadas(){
  const el=document.getElementById('a-selecionadas'); if(!el) return;
  const cnt=document.getElementById('a-qcount'); if(cnt) cnt.textContent=_avalSel.length;
  if(!_avalSel.length){ el.innerHTML='<div class="muted" style="padding:6px">Nenhuma questão ainda. Clique em "Adicionar questões".</div>'; return; }
  el.innerHTML=_avalSel.map((id,i)=>{ const q=_bancoQ.find(x=>x.id===id)||{};
    return `<div class="chk" style="cursor:default"><span style="flex:0;min-width:22px;color:var(--muted)">${i+1}.</span>
      <span style="flex:1">${esc((q.enunciado||'').slice(0,70))}${(q.enunciado||'').length>70?'…':''}</span>
      <span class="badge ${q.tipo==='objetiva'?'b-blue':'b-amber'}">${q.tipo==='objetiva'?'Obj':'Diss'}</span>
      <span class="muted" style="font-size:11px">${esc(_bancoCatMap[q.categoria_id]||'')}${tagsInline(q)} · ${q.peso}pt</span>
      <button type="button" class="btn ghost sm" title="Remover" onclick="removerSel('${id}')">✕</button></div>`;
  }).join('');
}
function removerSel(id){ _avalSel=_avalSel.filter(x=>x!==id); renderSelecionadas(); }
function abrirPicker(){
  const comps=allTags(_bancoQ);
  const cats=[...new Set(_bancoQ.map(q=>q.categoria_id).filter(Boolean))].map(id=>({id,nome:_bancoCatMap[id]||'—'}));
  openModal2(`<h2>Adicionar questões</h2>
    <div class="row">
      <input id="pk-busca" placeholder="Buscar no enunciado…" oninput="filtrarPicker()">
      <select id="pk-cat" onchange="filtrarPicker()"><option value="">Todas categorias</option>${cats.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select>
      <select id="pk-comp" onchange="filtrarPicker()"><option value="">Todas etiquetas</option>${comps.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select>
      <select id="pk-tipo" onchange="filtrarPicker()"><option value="">Todos tipos</option><option value="objetiva">Objetiva</option><option value="dissertativa">Dissertativa</option></select>
    </div>
    <div style="margin:8px 0;font-size:12px"><a onclick="pkMarcar(true)">marcar visíveis</a> · <a onclick="pkMarcar(false)">limpar</a></div>
    <div id="pk-lista" style="max-height:340px;overflow:auto;border:1px solid var(--border);border-radius:9px;padding:8px"></div>
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn green" onclick="addTodasFiltradas()">➕ Adicionar todas as filtradas (<span id="pk-count">0</span>)</button>
      <button class="btn primary" onclick="addSelecionadas()">Adicionar marcadas</button>
      <button class="btn ghost" onclick="closeModal2()">Fechar</button></div>`);
  filtrarPicker();
}
function pickerFiltradas(){
  const q=(inVal('pk-busca')||'').toLowerCase(), cat=inVal('pk-cat'), comp=inVal('pk-comp'), tipo=inVal('pk-tipo');
  return _bancoQ.filter(x=>!_avalSel.includes(x.id)
    && (!q||x.enunciado.toLowerCase().includes(q)) && (!cat||x.categoria_id===cat)
    && (!comp||tagsDe(x).includes(comp)) && (!tipo||x.tipo===tipo));
}
function filtrarPicker(){
  const disp=pickerFiltradas();
  const cnt=document.getElementById('pk-count'); if(cnt) cnt.textContent=disp.length;
  const el=document.getElementById('pk-lista');
  el.innerHTML = disp.length ? disp.map(q2=>`<label class="chk"><input type="checkbox" class="pk-q" value="${q2.id}">
      <span style="flex:1">${esc(q2.enunciado.slice(0,80))}${q2.enunciado.length>80?'…':''}</span>
      <span class="badge ${q2.tipo==='objetiva'?'b-blue':'b-amber'}">${q2.tipo==='objetiva'?'Obj':'Diss'}</span>
      <span class="muted" style="font-size:11px">${esc(_bancoCatMap[q2.categoria_id]||'')}${tagsInline(q2)} · ${q2.peso}pt</span></label>`).join('')
    : '<div class="muted" style="padding:6px">Nenhuma questão encontrada (ou já estão na prova).</div>';
}
function pkMarcar(v){ document.querySelectorAll('.pk-q').forEach(c=>c.checked=v); }
function addSelecionadas(){
  [...document.querySelectorAll('.pk-q:checked')].map(c=>c.value).forEach(id=>{ if(!_avalSel.includes(id)) _avalSel.push(id); });
  closeModal2(); renderSelecionadas();
}
function addTodasFiltradas(){
  const disp=pickerFiltradas();
  if(!disp.length){ toast('Nenhuma questão nos filtros atuais.','err'); return; }
  disp.forEach(q=>{ if(!_avalSel.includes(q.id)) _avalSel.push(q.id); });
  closeModal2(); renderSelecionadas(); toast(`${disp.length} questão(ões) adicionada(s).`,'ok');
}

async function salvarAvaliacao(id){
  const titulo=inVal('a-tit').trim(); if(!titulo){ toast('Dê um título.','err'); return; }
  const qs=_avalSel.slice();
  const ds=[...document.querySelectorAll('.a-d:checked')].map(c=>c.value);
  if(!qs.length){ toast('Selecione pelo menos uma questão.','err'); return; }
  if(!ds.length){ toast('Selecione pelo menos um destinatário.','err'); return; }
  const body={ titulo, descricao:inVal('a-desc').trim()||null, nota_corte:parseFloat(inVal('a-corte'))||70,
    inicio:toISO(inVal('a-ini')), fim:toISO(inVal('a-fim')), embaralhar:document.getElementById('a-emb').checked };
  try{
    let avalId=id;
    if(id){ await patch(`avaliacoes?id=eq.${id}`, body); }
    else { body.criado_por=U.id; body.status='rascunho'; avalId=(await post('avaliacoes', body))[0].id; }
    // regrava questões e destinatários (simples: apaga e insere)
    await del(`avaliacao_questoes?avaliacao_id=eq.${avalId}`);
    await post('avaliacao_questoes', qs.map((qid,i)=>({avaliacao_id:avalId,questao_id:qid,ordem:i})));
    await del(`avaliacao_destinatarios?avaliacao_id=eq.${avalId}`);
    await post('avaliacao_destinatarios', ds.map(cid=>({avaliacao_id:avalId,colaborador_id:cid})));
    closeModal(); toast('Avaliação salva.','ok'); viewAvaliacoes();
  }catch(e){ toast('Erro: '+e.message,'err'); }
}
async function mudarStatusAval(id,st){
  if(st==='disponivel' && !confirm('Disponibilizar para os colaboradores agora?')) return;
  try{ await patch(`avaliacoes?id=eq.${id}`,{status:st}); toast('Status atualizado.','ok'); viewAvaliacoes(); }
  catch(e){ toast('Erro: '+e.message,'err'); }
}
async function duplicarAvaliacao(id){
  if(!confirm('Duplicar esta avaliação? Será criada uma cópia como RASCUNHO (mesmas questões e destinatários), para você ajustar e disponibilizar.')) return;
  try{
    const a=(await get(`avaliacoes?id=eq.${id}&select=*&limit=1`))[0];
    const links=await get(`avaliacao_questoes?avaliacao_id=eq.${id}&select=questao_id,ordem,peso&order=ordem.asc`);
    const dests=await get(`avaliacao_destinatarios?avaliacao_id=eq.${id}&select=colaborador_id`);
    const novo=(await post('avaliacoes',{ titulo:(a.titulo||'Avaliação')+' (cópia)', descricao:a.descricao||null,
      nota_corte:a.nota_corte, inicio:null, fim:null, embaralhar:a.embaralhar, status:'rascunho', criado_por:U.id }))[0];
    if(links.length) await post('avaliacao_questoes', links.map(l=>({avaliacao_id:novo.id, questao_id:l.questao_id, ordem:l.ordem, peso:l.peso})));
    if(dests.length) await post('avaliacao_destinatarios', dests.map(d=>({avaliacao_id:novo.id, colaborador_id:d.colaborador_id})));
    toast('Avaliação duplicada (rascunho). Ajuste o período e disponibilize.','ok'); viewAvaliacoes();
  }catch(e){ toast('Erro ao duplicar: '+e.message,'err'); }
}
async function excluirAvaliacao(id){
  if(!confirm('Excluir esta avaliação e todas as respostas dela? Não pode ser desfeito.')) return;
  try{ await del(`avaliacoes?id=eq.${id}`); toast('Excluída.','ok'); viewAvaliacoes(); }
  catch(e){ toast('Erro: '+e.message,'err'); }
}
async function verParticipacao(id){
  const [aval,dests,tents]=await Promise.all([
    get(`avaliacoes?id=eq.${id}&select=titulo&limit=1`),
    get(`avaliacao_destinatarios?avaliacao_id=eq.${id}&select=colaborador_id`),
    get(`avaliacao_tentativas?avaliacao_id=eq.${id}&select=*`)
  ]);
  const cids=dests.map(d=>d.colaborador_id);
  const colabs=cids.length? await get(`colaboradores?id=in.(${cids.join(',')})&select=id,nome,apelido`):[];
  const tByC={}; tents.forEach(t=>tByC[t.colaborador_id]=t);
  openModal(`<h2>Quem fez — ${esc(aval[0].titulo)}</h2>
    <table><thead><tr><th>Colaborador</th><th>Status</th><th>Nota</th><th></th></tr></thead><tbody>`+
    colabs.map(c=>{ const t=tByC[c.id];
      const podeVer = t && t.status!=='em_andamento';
      return `<tr><td>${esc(c.apelido||c.nome)}</td>
        <td>${t?statusBadge(t.status==='em_andamento'?'em_andamento':t.status):'<span class="badge b-grey">Não iniciou</span>'}</td>
        <td>${t&&t.percentual!=null?t.percentual+'%':'—'}</td>
        <td>${podeVer?`<button class="btn ghost sm" onclick="verRespostasTentativa('${t.id}')">👁️ Ver respostas</button>`:''}</td></tr>`;
    }).join('')+`</tbody></table>
    <div style="margin-top:14px"><button class="btn ghost" onclick="closeModal()">Fechar</button></div>`, true);
}

// Ver as respostas de um colaborador (durante ou após a correção) — abre sobre o "Quem fez"
async function verRespostasTentativa(tentId){
  try{
    const t=(await get(`avaliacao_tentativas?id=eq.${tentId}&select=*&limit=1`))[0];
    const aval=(await get(`avaliacoes?id=eq.${t.avaliacao_id}&select=titulo&limit=1`))[0];
    const colab=(await get(`colaboradores?id=eq.${t.colaborador_id}&select=nome,apelido&limit=1`))[0];
    const resp=await get(`avaliacao_respostas?tentativa_id=eq.${tentId}&select=*`);
    const qids=resp.map(r=>r.questao_id);
    const qs=qids.length? await get(`aval_questoes?id=in.(${qids.join(',')})&select=*`):[];
    const qm={}; qs.forEach(q=>qm[q.id]=q);
    const links=await get(`avaliacao_questoes?avaliacao_id=eq.${t.avaliacao_id}&select=questao_id,ordem&order=ordem.asc`);
    const ord={}; links.forEach((l,i)=>ord[l.questao_id]=i);
    resp.sort((a,b)=>(ord[a.questao_id]??99)-(ord[b.questao_id]??99));
    const corpo=resp.map((r,i)=>{ const q=qm[r.questao_id]||{};
      let body='';
      if(q.tipo==='objetiva'){ const alts=q.alternativas||{};
        body=Object.keys(alts).filter(k=>alts[k]).map(k=>{ let cls=''; if(k===q.resposta_correta)cls='ok'; else if(k===r.resposta&&k!==q.resposta_correta)cls='err';
          return `<div class="opt ${cls}"><div class="k">${k}</div><div>${esc(alts[k])}</div></div>`; }).join('');
      } else {
        body=`<div class="muted" style="font-size:12px">Resposta do colaborador:</div><div class="q" style="margin:4px 0;background:var(--card)">${esc(r.resposta||'—')}</div>`
          +(r.feedback?`<div class="muted" style="font-size:12px">Comentário da correção:</div><div class="q" style="margin:4px 0;background:var(--card)">${esc(r.feedback)}</div>`:'');
      }
      const badge = r.correta==null?'b-grey':(r.correta?'b-green':'b-red');
      return `<div class="q"><div class="enun">${i+1}. ${esc(q.enunciado||'')} <span class="badge ${badge}" style="float:right">${r.pontos??0}/${r.pontos_max??0}pt</span></div>${body}
        ${q.explicacao?`<div class="muted" style="font-size:12px;margin-top:6px">💡 ${esc(q.explicacao)}</div>`:''}</div>`;
    }).join('');
    openModal2(`<h2>${esc(colab.apelido||colab.nome)} — ${esc(aval.titulo)}</h2>
      <div class="muted" style="margin-bottom:10px">${statusBadge(t.status)} · Nota: ${t.nota??'—'} / ${t.nota_max??'—'} · ${t.percentual??'—'}%</div>
      ${corpo||'<div class="muted">Sem respostas registradas.</div>'}
      <div style="margin-top:14px"><button class="btn ghost" onclick="closeModal2()">Fechar</button></div>`);
  }catch(e){ toast('Erro ao abrir respostas: '+e.message,'err'); }
}

// ══════════════════════════════════════════════════════════
// CORREÇÃO (gestor / super)
// ══════════════════════════════════════════════════════════
async function viewCorrecao(){
  const v=document.getElementById('view');
  try{
    const tents=await get(`avaliacao_tentativas?status=in.(enviada,corrigida)&select=*&order=enviado_em.asc`);
    if(!tents.length){ v.innerHTML=`<div class="card center muted">Nada para corrigir no momento. 🎉</div>`; return; }
    const avIds=[...new Set(tents.map(t=>t.avaliacao_id))], cIds=[...new Set(tents.map(t=>t.colaborador_id))];
    const [avs,colabs]=await Promise.all([
      get(`avaliacoes?id=in.(${avIds.join(',')})&select=id,titulo,nota_corte`),
      get(`colaboradores?id=in.(${cIds.join(',')})&select=id,nome,apelido`)
    ]);
    const am={}; avs.forEach(a=>am[a.id]=a); const cm={}; colabs.forEach(c=>cm[c.id]=c.apelido||c.nome);
    v.innerHTML=`<div class="card"><h2>Correção</h2><div class="muted">${tents.length} aguardando</div></div>
      <div class="card" style="padding:4px 0"><table><thead><tr><th>Colaborador</th><th>Avaliação</th><th>Enviada</th><th>Status</th><th></th></tr></thead><tbody>`+
      tents.map(t=>`<tr><td>${esc(cm[t.colaborador_id]||'—')}</td><td>${esc((am[t.avaliacao_id]||{}).titulo||'—')}</td>
        <td class="muted">${fmtDt(t.enviado_em)}</td><td>${statusBadge(t.status)}</td>
        <td><button class="btn primary sm" onclick="corrigir('${t.id}')">Corrigir</button></td></tr>`).join('')
      +`</tbody></table></div>`;
  }catch(e){ v.innerHTML=`<div class="card" style="color:var(--red)">Erro: ${esc(e.message)}</div>`; }
}
let _corr=null;
async function corrigir(tentId){
  const v=document.getElementById('view'); v.innerHTML='<div class="spin"></div>';
  try{
    const t=(await get(`avaliacao_tentativas?id=eq.${tentId}&select=*&limit=1`))[0];
    const aval=(await get(`avaliacoes?id=eq.${t.avaliacao_id}&select=*&limit=1`))[0];
    const colab=(await get(`colaboradores?id=eq.${t.colaborador_id}&select=nome,apelido&limit=1`))[0];
    const resp=await get(`avaliacao_respostas?tentativa_id=eq.${tentId}&select=*`);
    const qids=resp.map(r=>r.questao_id);
    const qs=qids.length? await get(`aval_questoes?id=in.(${qids.join(',')})&select=*`):[];
    const qm={}; qs.forEach(q=>qm[q.id]=q);
    // ordena pela ordem da avaliação
    const links=await get(`avaliacao_questoes?avaliacao_id=eq.${t.avaliacao_id}&select=questao_id,ordem&order=ordem.asc`);
    const ord={}; links.forEach((l,i)=>ord[l.questao_id]=i);
    resp.sort((a,b)=>(ord[a.questao_id]??99)-(ord[b.questao_id]??99));
    _corr={t,aval,resp,qm};
    v.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center">
        <div><h2>${esc(aval.titulo)}</h2><div class="muted">${esc(colab.apelido||colab.nome)} · enviada ${fmtDt(t.enviado_em)}</div></div>
        <div class="center"><div class="muted" style="font-size:11px">Nota parcial</div><div id="corr-nota" style="font-size:22px;font-weight:700"></div></div></div></div>`
      + resp.map((r,i)=>{
        const q=qm[r.questao_id]||{};
        if(q.tipo==='objetiva'){
          const alts=q.alternativas||{};
          const opts=Object.keys(alts).filter(k=>alts[k]).map(k=>{
            let cls=''; if(k===q.resposta_correta)cls='ok'; else if(k===r.resposta)cls='err';
            return `<div class="opt ${cls}"><div class="k">${k}</div><div>${esc(alts[k])}</div></div>`;
          }).join('');
          return `<div class="q"><div class="enun">${i+1}. ${esc(q.enunciado)} <span class="badge ${r.correta?'b-green':'b-red'}" style="float:right">${r.correta?'Acertou':'Errou'} · ${r.pontos||0}/${r.pontos_max}pt</span></div>${opts}
            <div class="muted" style="font-size:12px;margin-top:6px">Correção automática: <b>${r.correta?'acertou':'errou'}</b>. Ajuste os pontos e/ou o máximo da questão:</div>
            <div class="row" style="max-width:300px;margin-top:4px">
              <div style="flex:0;min-width:120px"><label style="margin-top:0">Pontos</label><input type="number" min="0" step="0.5" data-corr="${r.id}" value="${r.pontos!=null?r.pontos:(r.correta?r.pontos_max:0)}" oninput="recalcCorr()"></div>
              <div style="flex:0;min-width:120px"><label style="margin-top:0">Máx (peso)</label><input type="number" min="0" step="0.5" data-maxedit="${r.id}" value="${r.pontos_max}" oninput="recalcCorr()"></div>
            </div></div>`;
        } else {
          return `<div class="q"><div class="enun">${i+1}. ${esc(q.enunciado)} <span class="muted" style="font-weight:400">(${r.pontos_max}pt)</span></div>
            <div class="muted" style="font-size:12px">Resposta do colaborador:</div>
            <div class="q" style="margin:4px 0;background:var(--card)">${esc(r.resposta||'—')}</div>
            <div class="row">
              <div style="flex:0;min-width:120px"><label style="margin-top:0">Pontos</label><input type="number" min="0" step="0.5" data-corr="${r.id}" value="${r.pontos!=null?r.pontos:''}" oninput="recalcCorr()"></div>
              <div style="flex:0;min-width:120px"><label style="margin-top:0">Máx (peso)</label><input type="number" min="0" step="0.5" data-maxedit="${r.id}" value="${r.pontos_max}" oninput="recalcCorr()"></div>
              <div><label style="margin-top:0">Comentário (opcional)</label><input data-fb="${r.id}" value="${esc(r.feedback||'')}" placeholder="feedback para o colaborador"></div></div></div>`;
        }
      }).join('')
      + `<div class="card"><button class="btn green" onclick="salvarCorrecao(true)">Salvar e publicar resultado</button>
         <button class="btn primary" onclick="salvarCorrecao(false)">Salvar sem publicar</button>
         <button class="btn ghost" onclick="viewCorrecao()">Voltar</button></div>`;
    recalcCorr();
  }catch(e){ v.innerHTML=`<div class="card" style="color:var(--red)">Erro: ${esc(e.message)}</div>`; }
}
function maxDe(rid){ const m=document.querySelector(`[data-maxedit="${rid}"]`); let v=m?parseFloat(m.value):NaN; if(isNaN(v)) v=0; return Math.max(0,v); }
function pontosLinha(el){
  const max=maxDe(el.dataset.corr);
  let p=parseFloat(el.value); if(isNaN(p)) p=0;
  return Math.max(0, Math.min(max, p));
}
function recalcCorr(){
  let nota=0,max=0;
  document.querySelectorAll('[data-corr]').forEach(sel=>{ nota+=pontosLinha(sel); max+=maxDe(sel.dataset.corr); });
  const pct=max?Math.round(nota/max*100):0;
  const el=document.getElementById('corr-nota'); if(el) el.innerHTML=`${pct}% <span class="muted" style="font-size:12px">(${nota}/${max})</span>`;
}
async function salvarCorrecao(publicar){
  const {t,aval,resp}=_corr;
  try{
    let nota=0,max=0;
    for(const sel of document.querySelectorAll('[data-corr]')){
      const rid=sel.dataset.corr, pmax=maxDe(rid); const p=pontosLinha(sel);
      const fbEl=document.querySelector(`[data-fb="${rid}"]`); const fb=fbEl?fbEl.value.trim()||null:undefined;
      const correta = p>=pmax && pmax>0 ? true : (p<=0 ? false : null);
      const body={pontos:p, pontos_max:pmax, correta}; if(fb!==undefined) body.feedback=fb;
      await patch(`avaliacao_respostas?id=eq.${rid}`, body);
      nota+=p; max+=pmax;
    }
    const pct=max?Math.round(nota/max*100):0; const aprovado=pct>=(aval.nota_corte||0);
    await patch(`avaliacao_tentativas?id=eq.${t.id}`, {
      status: publicar?'publicada':'corrigida', nota, nota_max:max, percentual:pct, aprovado,
      corrigido_por:U.id, corrigido_em:new Date().toISOString()
    });
    await post('aval_auditoria', [{tentativa_id:t.id, acao: publicar?'corrigir+publicar':'corrigir', por:U.id,
      depois:{nota,nota_max:max,percentual:pct,aprovado}}]);
    toast(publicar?'Corrigida e publicada! O colaborador já pode ver.':'Correção salva.','ok');
    viewCorrecao();
  }catch(e){ toast('Erro ao salvar correção: '+e.message,'err'); }
}

function limparFiltrosMetr(){ ['mt-de','mt-ate','mt-colab','mt-aval'].forEach(id=>{const el=document.getElementById(id); if(el)el.value='';}); renderMetricas(); }
function renderMetricas(){
  if(!_metr) return;
  const {am,cm,qm,catNome}=_metr;
  const de=inVal('mt-de'), ate=inVal('mt-ate'), fColab=inVal('mt-colab'), fAval=inVal('mt-aval');
  const dia=t=> (t.corrigido_em||t.enviado_em||'').slice(0,10);
  const tents=_metr.tents.filter(t=>{
    const d=dia(t);
    if(de && d && d<de) return false;
    if(ate && d && d>ate) return false;
    if(fColab && t.colaborador_id!==fColab) return false;
    if(fAval && t.avaliacao_id!==fAval) return false;
    return true;
  });
  const tentIds=new Set(tents.map(t=>t.id));
  const resp=_metr.resp.filter(r=>tentIds.has(r.tentativa_id));
  const body=document.getElementById('metr-body'); if(!body) return;
  if(!tents.length){ body.innerHTML=`<div class="card center muted">Nenhum resultado para os filtros escolhidos.</div>`; return; }
  const porAval={}; tents.forEach(t=>{ (porAval[t.avaliacao_id]=porAval[t.avaliacao_id]||[]).push(t.percentual||0); });
  const porColab={}; tents.forEach(t=>{ (porColab[t.colaborador_id]=porColab[t.colaborador_id]||[]).push(t.percentual||0); });
  const ranking=Object.keys(porColab).map(cid=>({nome:cm[cid]||'—',media:Math.round(porColab[cid].reduce((a,b)=>a+b,0)/porColab[cid].length),n:porColab[cid].length})).sort((a,b)=>b.media-a.media);
  const porQ={}, porAssunto={};
  resp.forEach(r=>{
    if(r.correta==null) return; const q=qm[r.questao_id]; if(!q) return;
    (porQ[r.questao_id]=porQ[r.questao_id]||{ok:0,n:0,enun:q.enunciado}); porQ[r.questao_id].n++; if(r.correta)porQ[r.questao_id].ok++;
    const cat=catNome[q.categoria_id]||'Sem categoria';
    (porAssunto[cat]=porAssunto[cat]||{ok:0,n:0}); porAssunto[cat].n++; if(r.correta)porAssunto[cat].ok++;
  });
  const dificeis=Object.values(porQ).map(x=>({enun:x.enun,taxa:Math.round(x.ok/x.n*100),n:x.n})).sort((a,b)=>a.taxa-b.taxa).slice(0,8);
  const assuntos=Object.keys(porAssunto).map(k=>({nome:k,taxa:Math.round(porAssunto[k].ok/porAssunto[k].n*100),n:porAssunto[k].n})).sort((a,b)=>a.taxa-b.taxa);
  const mediaGeral=Math.round(tents.reduce((s,t)=>s+(t.percentual||0),0)/tents.length);
  // guarda o conjunto filtrado para exportação
  _metrData={ tents, am:_metr.am, cm:_metr.cm, qm:_metr.qm, catNome:_metr.catNome, porQ, assuntos };
  const bars=(arr,label,val,color)=>arr.map(x=>`<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
    <span>${esc(label(x))}</span><span class="muted">${val(x)}</span></div>
    <div class="bar"><span style="width:${x.taxa!=null?x.taxa:x.media}%;background:${color?color(x):'var(--accent)'}"></span></div></div>`).join('');
  body.innerHTML=`<div class="grid c3" style="margin-bottom:14px">
      <div class="kpi"><div class="n">${tents.length}</div><div class="l">Provas corrigidas</div></div>
      <div class="kpi"><div class="n">${mediaGeral}%</div><div class="l">Média geral</div></div>
      <div class="kpi"><div class="n">${ranking.length}</div><div class="l">Colaboradores</div></div>
    </div>
    <div class="grid c2">
      <div class="card"><h2>🏆 Ranking (média)</h2><div style="margin-top:10px">${bars(ranking,x=>x.nome,x=>x.media+'% ('+x.n+')',x=>x.media>=70?'var(--green)':'var(--amber)')}</div></div>
      <div class="card"><h2>📚 Dificuldade por assunto</h2><div style="margin-top:10px">${assuntos.length?bars(assuntos,x=>x.nome,x=>x.taxa+'% acertos',x=>x.taxa>=70?'var(--green)':'var(--red)'):'<span class="muted">Sem dados.</span>'}</div></div>
    </div>
    <div class="card"><h2>🔻 Questões que mais erram</h2><div style="margin-top:10px">${dificeis.length?bars(dificeis,x=>esc(x.enun.slice(0,60))+(x.enun.length>60?'…':''),x=>x.taxa+'% acertos',x=>x.taxa>=70?'var(--green)':'var(--red)'):'<span class="muted">Sem dados.</span>'}</div></div>
    <div class="card"><h2>Média por avaliação</h2><div style="margin-top:10px">${
      Object.keys(porAval).map(id=>{const arr=porAval[id];const m=Math.round(arr.reduce((a,b)=>a+b,0)/arr.length);
        return `<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>${esc(am[id]||'—')}</span><span class="muted">${m}% (${arr.length})</span></div><div class="bar"><span style="width:${m}%"></span></div></div>`;
      }).join('')
    }</div></div>`;
}

// ── Exportar relatório gerencial (.xlsx) respeitando os filtros atuais ──
function exportarRelatorio(){
  if(!_metrData || !_metrData.tents.length){ toast('Nada para exportar com os filtros atuais.','err'); return; }
  const {tents,am,cm,qm,catNome,porQ}=_metrData;
  const sit=t=> t.aprovado==null?'—':(t.aprovado?'Aprovado':'Recuperação');
  // 1) Notas de todos os colaboradores
  const notasHead=['Colaborador','Avaliação','Nota','Nota máx','Percentual','Situação','Data correção'];
  const notasRows=tents.slice().sort((a,b)=>(cm[a.colaborador_id]||'').localeCompare(cm[b.colaborador_id]||''))
    .map(t=>[ cm[t.colaborador_id]||'—', am[t.avaliacao_id]||'—', t.nota??'', t.nota_max??'', (t.percentual??'')+'%', sit(t),
      t.corrigido_em? new Date(t.corrigido_em).toLocaleString('pt-BR'):'' ]);
  // 2) Questões que MAIS DA METADE errou (taxa de acerto < 50%)
  const qStats=Object.keys(porQ).map(qid=>{ const x=porQ[qid]; const q=qm[qid]||{};
    return { enun:x.enun||q.enunciado||'', cat:catNome[q.categoria_id]||'Sem categoria', comp:tagsDe(q).join(', '),
      taxa:Math.round(x.ok/x.n*100), erraram:x.n-x.ok, responderam:x.n }; });
  const criticas=qStats.filter(x=>x.taxa<50).sort((a,b)=>a.taxa-b.taxa);
  const critHead=['Questão','Categoria','Etiquetas','% acerto','Erraram','Responderam'];
  const critRows=(criticas.length?criticas:qStats.sort((a,b)=>a.taxa-b.taxa)).map(x=>[x.enun,x.cat,x.comp,x.taxa+'%',x.erraram,x.responderam]);
  // 3) Por assunto
  const assHead=['Assunto','% acerto','Respostas'];
  const assRows=(_metrData.assuntos||[]).map(a=>[a.nome,a.taxa+'%',a.n]);
  // monta o arquivo
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([notasHead,...notasRows]), 'Notas');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([ ['Questões que mais da metade errou (acerto < 50%)'], [], critHead, ...critRows ]), 'Questões críticas');
  if(assRows.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([assHead,...assRows]), 'Por assunto');
  const hoje=new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `relatorio_avaliacoes_${hoje}.xlsx`);
  toast('Relatório exportado.','ok');
}

// Pontuação estilo Kahoot: acerto vale 500..1000 conforme a rapidez; erro = 0.
function qlCalcPontos(correto, tempoMs, tempoLimiteS){
  if(!correto) return 0;
  const lim = Math.max(1, tempoLimiteS) * 1000;
  const frac = Math.max(0, Math.min(1, 1 - (tempoMs / lim)));
  return Math.round(500 + 500 * frac);
}
// Agrega a pontuação da sala a partir das respostas (fonte de verdade do ranking).
async function quizAgrega(sessaoId){
  const [resp, parts] = await Promise.all([
    get(`quiz_respostas?sessao_id=eq.${sessaoId}&select=colaborador_id,pontos,correto`),
    get(`quiz_participantes?sessao_id=eq.${sessaoId}&select=colaborador_id,nome`)
  ]);
  const map = {};
  parts.forEach(p => { map[p.colaborador_id] = { id:p.colaborador_id, nome:p.nome||'?', pontos:0, acertos:0 }; });
  resp.forEach(r => {
    if(!map[r.colaborador_id]) map[r.colaborador_id] = { id:r.colaborador_id, nome:'?', pontos:0, acertos:0 };
    map[r.colaborador_id].pontos += (r.pontos||0);
    if(r.correto) map[r.colaborador_id].acertos++;
  });
  return Object.values(map).sort((a,b)=> b.pontos - a.pontos);
}
function altsDe(q){ const a=q.alternativas||{}; return Object.keys(a).filter(k=>a[k]); }

function cmpKey(e){

}

async function qlEntrar(sessaoId){
  try{
    const s=(await get(`quiz_sessoes?id=eq.${sessaoId}&select=*&limit=1`))[0];
    if(!s || s.status==='encerrado'){ toast('Essa sala já encerrou.','err'); viewQuizLive(); return; }
    try{ await post('quiz_participantes', { sessao_id:sessaoId, colaborador_id:U.id, nome:(U.apelido||U.nome) }); }catch(e){ /* já estava na sala */ }
    const ids=(s.questao_ids||[]);
    const qs=ids.length?await get(`aval_questoes?id=in.(${ids.join(',')})&select=*`):[];
    const byId={}; qs.forEach(x=>byId[x.id]=x);
    _ql={ sessaoId, s, qs:ids.map(i=>byId[i]).filter(Boolean), lastIndice:-1, answered:false, locked:false };
    _qlPoll=setInterval(qlPoll, 1000); qlPoll();
  }catch(e){ toast('Erro ao entrar: '+e.message,'err'); }
}
function qlStop(){ if(_qlPoll){clearInterval(_qlPoll);_qlPoll=null;} if(_qlTick){clearInterval(_qlTick);_qlTick=null;} _ql=null; }
function qlStopTick(){ if(_qlTick){clearInterval(_qlTick);_qlTick=null;} }
async function qlPoll(){
  if(!_ql) return;
  if(abaAtual!=='quizlive'){ qlStop(); return; } // saiu da aba → para
  let s; try{ s=(await get(`quiz_sessoes?id=eq.${_ql.sessaoId}&select=status,indice,pergunta_iniciada_em&limit=1`))[0]; }catch(e){ return; }
  if(!s) return;
  _ql.s.status=s.status; _ql.s.indice=s.indice; _ql.s.pergunta_iniciada_em=s.pergunta_iniciada_em;
  if(s.status==='lobby'){ if(_ql.lastIndice!==-2){ _ql.lastIndice=-2; qlRenderLobby(); } return; }
  if(s.status==='encerrado'){ qlStopTick(); qlRenderFinal(); return; }
  if(s.status==='questao'){
    if(_ql.lastIndice!==s.indice){ _ql.lastIndice=s.indice; _ql.answered=false; _ql.locked=false; qlRenderQuestao(); }
    return;
  }
  if(s.status==='revelado'){ qlStopTick(); qlRenderRevelado(); return; }
}

async function qlResponder(k){

  const obj=q.tipo==='objetiva';
  const alts=q.alternativas||{};
  const altsHtml = obj ? `<div class="qz-alts">`+Object.keys(alts).filter(k=>alts[k]).map((k,idx)=>
      `<div class="qz-alt ${CORES[idx]||'cA'}" data-k="${k}" style="animation-delay:${(.12+idx*.08).toFixed(2)}s"><span class="qz-sh">${FORMAS[idx]||'●'}</span><div class="qz-k">${k}</div><div>${esc(alts[k])}</div></div>`).join('')+`</div>`
    : `<div class="qz-falada">🗣️ Pergunta de resposta falada — a turma responde em voz alta. Clique em “Revelar” para mostrar o gabarito.</div>`;
  const pct=Math.round((_qz.i+1)/_qz.qs.length*100);
  stage.innerHTML=`
    <div class="qz-top">
      <span class="qz-brand">${UPLOGO}UpSeller</span>
      <span class="qz-title">${esc(_qz.titulo)}</span>
      <span class="qz-badge n">${_qz.i+1} / ${_qz.qs.length}</span>
      <span class="qz-badge">${obj?'Objetiva':'Falada'}</span>
      <button class="qz-ico" title="Som (M)" onclick="qzMute()">${_muted?'🔇':'🔊'}</button>
      <button class="qz-ico" title="Tela cheia (F)" onclick="qzFull()">⛶</button>
      <button class="qz-ico" title="Sair (Esc)" onclick="qzSair()">✕</button>
    </div>
    <div class="qz-prog"><i style="width:${pct}%"></i></div>
    <div class="qz-mid qz-anim">
      <div class="qz-fit" id="qz-fit">
        <div class="qz-enun">${esc(q.enunciado)}</div>
        <div class="qz-timer" style="--p:100"><span class="qz-timenum">${_qz.tempo}</span></div>
        ${altsHtml}
        <div class="qz-expl"><div class="qz-expl-t">${obj?'Resposta correta e explicação':'Gabarito / pontos esperados'}</div>
          ${obj&&q.resposta_correta?`<b>Resposta: ${esc(q.resposta_correta)}</b> — ${esc((alts[q.resposta_correta]||''))}<br>`:''}
          ${esc(q.explicacao||'')||'<span style="opacity:.7">(sem explicação cadastrada)</span>'}</div>
      </div>
    </div>
    <div class="qz-ctrls">
      <button class="qz-btn" onclick="qzPrev()">‹ Anterior</button>
      <button class="qz-btn main" id="qz-reveal" onclick="qzReveal()">Revelar (espaço)</button>
      <button class="qz-btn blue" onclick="qzNext()">Próxima ›</button>
      <button class="qz-btn" onclick="qzPause()" id="qz-pause">⏸ Pausar</button>
      <button class="qz-btn" onclick="qzTempo(-5)">− 5s</button>
      <button class="qz-btn" onclick="qzTempo(5)">+ 5s</button>
    </div>
    <div class="qz-hint">Espaço = revelar · → próxima · ← anterior · P pausar · +/− tempo · M som · F tela cheia · Esc sair</div>`;
  qzPaintTimer();
  qzStartTimer();
  requestAnimationFrame(qzFit);
}
function qzFit(){
  const mid=document.querySelector('#quiz-stage .qz-mid');
  const fit=document.getElementById('qz-fit');
  if(!mid||!fit) return;
  fit.style.transform='';
  const avail=mid.clientHeight, nat=fit.scrollHeight;
  if(nat>avail && avail>0){
    const s=Math.max(0.35, (avail/nat)-0.012);
    fit.style.transform='scale('+s.toFixed(3)+')';
  }
}
function qzReveal(){
  if(_qz.revealed) return;
  _qz.revealed=true; qzStopTimer();
  const stage=document.getElementById('quiz-stage'); stage.classList.add('reveal');
  const q=_qz.qs[_qz.i];
  qzSound('reveal');
  if(q.tipo==='objetiva' && q.resposta_correta){
    const el=stage.querySelector(`.qz-alt[data-k="${q.resposta_correta}"]`);
    if(el){ el.classList.add('correct'); setTimeout(()=>{ qzSound('correct'); qzBurst(el); },260); }
  } else {
    setTimeout(()=>qzSound('correct'),260);
  }
  qzPaintTimer();
  requestAnimationFrame(qzFit);
  const rb=document.getElementById('qz-reveal'); if(rb){ rb.textContent='Revelado'; rb.disabled=true; rb.style.opacity=.5; }
}
function qzBurst(target){
  const stage=document.getElementById('quiz-stage'); if(!stage||!target) return;
  const r=target.getBoundingClientRect(), sr=stage.getBoundingClientRect();
  const b=document.createElement('div'); b.className='qz-burst';
  b.style.left=(r.left-sr.left+r.width/2)+'px'; b.style.top=(r.top-sr.top+r.height/2)+'px';
  const cols=['#22c55e','#1f6fff','#ff8a1e','#fbbf24','#f43f5e','#a78bfa'];
  for(let i=0;i<22;i++){ const p=document.createElement('i'); const ang=Math.random()*Math.PI*2, dist=90+Math.random()*180;
    p.style.setProperty('--tx',(Math.cos(ang)*dist).toFixed(0)+'px'); p.style.setProperty('--ty',(Math.sin(ang)*dist).toFixed(0)+'px');
    p.style.setProperty('--rot',(Math.random()*540-270).toFixed(0)+'deg'); p.style.background=cols[i%cols.length];
    p.style.animationDelay=(Math.random()*.08).toFixed(2)+'s'; b.appendChild(p); }
  stage.appendChild(b); setTimeout(()=>b.remove(),1100);
}
function qzNext(){ if(_qz.i<_qz.qs.length-1){ _qz.i++; qzSound('next'); qzRender(); } else { toast('Fim do quiz!','ok'); qzSound('correct'); } }
function qzPrev(){ if(_qz.i>0){ _qz.i--; qzSound('next'); qzRender(); } }
function qzPause(){ _qz.paused=!_qz.paused; const b=document.getElementById('qz-pause'); if(b) b.textContent=_qz.paused?'▶ Retomar':'⏸ Pausar'; }
function qzTempo(d){ _qz.tempo=Math.max(3,Math.min(300,_qz.tempo+d)); if(!_qz.revealed){ _qz.remaining=Math.max(1,_qz.remaining+d); qzPaintTimer(); } toast('Tempo: '+_qz.tempo+'s','ok'); }
function qzMute(){ _muted=!_muted; if(!_muted) qzSound('next'); const b=document.querySelector('#quiz-stage .qz-ico'); if(b) b.textContent=_muted?'🔇':'🔊'; toast(_muted?'Som desligado':'Som ligado','ok'); }
function qzFull(){ const s=document.getElementById('quiz-stage'); if(!document.fullscreenElement){ (s.requestFullscreen&&s.requestFullscreen()); } else { document.exitFullscreen&&document.exitFullscreen(); } }
function qzSair(){ qzStopTimer(); document.removeEventListener('keydown',qzKey); window.removeEventListener('resize',qzFit); if(document.fullscreenElement) document.exitFullscreen&&document.exitFullscreen(); const s=document.getElementById('quiz-stage'); s.classList.remove('on','reveal'); s.innerHTML=''; _qz=null; }
function qzKey(e){
  if(!_qz) return;
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); if(!_qz.revealed) qzReveal(); else qzNext(); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); qzNext(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); qzPrev(); }
  else if(e.key==='p'||e.key==='P'){ qzPause(); }
  else if(e.key==='+'||e.key==='='){ qzTempo(5); }
  else if(e.key==='-'||e.key==='_'){ qzTempo(-5); }
  else if(e.key==='m'||e.key==='M'){ qzMute(); }
  else if(e.key==='f'||e.key==='F'){ qzFull(); }
  else if(e.key==='Escape'){ qzSair(); }
}
// ── Sons interativos (WebAudio, sem arquivos externos) ──
let _ac=null,_muted=false;
function qzAC(){ try{ if(!_ac) _ac=new (window.AudioContext||window.webkitAudioContext)(); if(_ac.state==='suspended') _ac.resume(); return _ac; }catch(e){ return null; } }
function qzTone(freq,dur,when,type,vol){ const a=qzAC(); if(!a) return; const t0=a.currentTime+(when||0); const o=a.createOscillator(),g=a.createGain(); o.type=type||'sine'; o.frequency.value=freq; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol||.12,t0+.015); g.gain.exponentialRampToValueAtTime(.0001,t0+dur); o.start(t0); o.stop(t0+dur+.03); }
function qzSweep(f1,f2,dur,type,vol){ const a=qzAC(); if(!a) return; const o=a.createOscillator(),g=a.createGain(); o.type=type||'sawtooth'; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol||.09,t+.04); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.start(t); o.stop(t+dur+.03); }
function qzSound(name){
  if(_muted) return;
  switch(name){
    case 'start': [[523,0],[659,.1],[784,.2],[1047,.32]].forEach(([f,w],i)=>qzTone(f,i===3?.4:.14,w,'triangle',.14)); break;
    case 'tick': qzTone(880,.05,0,'square',.05); break;
    case 'tickHot': qzTone(1245,.06,0,'square',.08); break;
    case 'timeup': qzTone(196,.5,0,'sawtooth',.13); qzTone(147,.55,.04,'sawtooth',.1); break;
    case 'reveal': qzSweep(240,900,.28,'sawtooth',.08); break;
    case 'correct': [[659,0],[784,.11],[988,.22],[1319,.34]].forEach(([f,w])=>qzTone(f,.5,w,'triangle',.16)); break;
    case 'next': qzTone(588,.08,0,'triangle',.08); qzTone(880,.1,.06,'triangle',.07); break;
  }
}
function qzBeep(){ qzSound('timeup'); }

// ══════════════════════════════════════════════════════════
// Boot
// ══════════════════════════════════════════════════════════
aplicarTema();
(function boot(){
  U=lerSessao();
  if(U){ iniciarApp(); }
  else { document.getElementById('login').style.display='block'; }
})();
</script>
